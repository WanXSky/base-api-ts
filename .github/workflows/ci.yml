name: Build and Push to GHCR.io

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/wanxsky/base-api
  
jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    environment: ci
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Login to GHCR.io
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}
      
    - name: Build and Push to GHCR.io
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_NAME }}
  
  deploy:
    name: Deploy to K3s
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ci
    
    steps:
    - name:
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          echo "Memulai proses Rolling update di k3s"
          sudo kubectl rollout restart deployment api-deploy
          sudo kubectl rollout status deployment api-deploy
          echo "Deploy Sukses coy"
