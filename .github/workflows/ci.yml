name: Build and Push to GHCR.io

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/wanxsky/base-api
  
jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    environment: ci
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    
    - name: Login to GHCR.io
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}
      
    - name: Build and Push to GHCR.io
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NAME }}:latest

    - name: Update deployment image and push
      env:
        GITHUB_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
      run: |
        sed -i "s|image: ghcr.io/wanxsky/base-api:[a-zA-Z0-9]*|image: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}|g" k3s/api-deployment.yaml
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k3s/api-deployment.yaml
        git diff --staged --quiet || git commit -m "chore: update api image to ${{ env.SHORT_SHA }}"
        git push https://x-access-token:${GITHUB_TOKEN}@github.com/WanXSky/base-api-ts.git main
