apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: api-ingress 
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.kzt.biz.id
      secretName: api-tls
  rules:
    - host: api.kzt.biz.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: 
                name: api-service 
                port: 
                  number: 3000
